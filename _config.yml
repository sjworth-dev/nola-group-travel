# Site settings
title: New Orleans Group Travel Guide
tagline: The Big-Group Guide to New Orleans
description: An independent, opinionated guide to planning a big group trip to New Orleans. Where the whole crew can stay under one roof, what's worth doing, and what's tourist bait.
url: "https://nolagrouptravel.com"
baseurl: ""

# SEO
# No `author:` on purpose — jekyll-seo-tag would emit it as a schema.org Person,
# and the site has no named human author; the publisher is the site itself.
twitter:
  card: summary_large_image
social:
  name: New Orleans Group Travel Guide

# Analytics
# PostHog project API key (public client key, phc_…). Empty = the snippet in
# _layouts/default.html renders nothing and no event ever leaves the page.
# This must be NGT's OWN project key — never the shared CastleDay/Syd key,
# which would fingerprint this independent site in view-source (same rule
# that got NGT its own GA property instead of the CastleDay tag).
posthog_key: ""

# Build settings
markdown: kramdown
permalink: pretty
highlighter: rouge

# Collections
collections:
  guides:
    output: true
    permalink: /guides/:name/
  neighborhoods:
    output: true
    permalink: /neighborhoods/:name/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.jpg
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "neighborhoods"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - ROADMAP.md
  - ROADMAP-ARCHIVE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
