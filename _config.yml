# Site settings
title: New Orleans Group Travel Guide
tagline: Where to Stay With 11-30 People
description: The insider guide to planning group trips to New Orleans. Where to stay, what to do, and how to coordinate 10-30 people in the Big Easy.
url: "https://nolagrouptravel.com"
baseurl: ""

# SEO
author: New Orleans Group Travel Guide
twitter:
  card: summary_large_image
social:
  name: New Orleans Group Travel Guide

# Build settings
markdown: kramdown
permalink: pretty
highlighter: rouge

# Collections
collections:
  guides:
    output: true
    permalink: /guides/:name/
  neighborhoods:
    output: true
    permalink: /neighborhoods/:name/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/castleday-aerial.jpg
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "neighborhoods"
    values:
      layout: "guide"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - ROADMAP.md
  - ROADMAP-ARCHIVE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
