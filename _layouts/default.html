<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FBFAF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121511" media="(prefers-color-scheme: dark)">

  <!-- Apply the stored theme before first paint so there is no flash -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('ngt-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- SEO (emits description, canonical, Open Graph). The title tag is hand-rolled so page
       titles keep their full length in search results instead of losing ~30 characters to
       a "| New Orleans Group Travel Guide" suffix nobody searches for. -->
  {% if page.url == "/" %}
  <title>{{ site.title }} — {{ site.tagline }}</title>
  {% else %}
  <title>{{ page.title | default: site.title }}</title>
  {% endif %}
  {% seo title=false %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Inter+Tight:ital,wght@0,300..700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Google Search Console ownership (property https://nolagrouptravel.com/, sam@staymarais.com).
       Primary verification is via Google Analytics; this meta tag is the durable backup so ownership
       survives any future change to the GA4 tag below. Do not remove either one. -->
  <meta name="google-site-verification" content="Q9Cs15l6QYBEwdc-72m_EzloWVPLKBNkBlvGRKpkEw0">

  <!-- Analytics — GA4 property "NOLA Group Travel" (its own property; never reuse the CastleDay tag).
       Tag is skipped for automated browsers (navigator.webdriver) to keep scraper/bot noise out of GA. -->
  <script>
    if (!navigator.webdriver) {
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-NCXH4RWEH7';
      document.head.appendChild(gaScript);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NCXH4RWEH7');
    }
  </script>
  {% if site.posthog_key != "" %}
  <!-- PostHog — the site's own project (see posthog_key in _config.yml; never the shared
       CastleDay/Syd key). Self-hosted array.js, same navigator.webdriver bot gate as GA,
       host-gated to the apex so localhost and preview builds never send data. -->
  <script>
    if (!navigator.webdriver && location.hostname === 'nolagrouptravel.com') {
      var phScript = document.createElement('script');
      phScript.async = true;
      phScript.src = '{{ "/assets/js/posthog-array.js" | relative_url }}?v=1.403.0';
      phScript.onload = function () {
        window.posthog && window.posthog.init('{{ site.posthog_key }}', {
          api_host: 'https://us.i.posthog.com',
          capture_pageview: true,
          capture_pageleave: true,
          person_profiles: 'identified_only',
          session_recording: { maskAllInputs: true }
        });
      };
      document.head.appendChild(phScript);
    }
  </script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
